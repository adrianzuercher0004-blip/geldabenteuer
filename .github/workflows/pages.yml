name: Spiel veröffentlichen
on:
  push:
    branches: [main]
    paths:
      - Geldabenteuer-GitHub.zip
      - lebensquest/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Spielpaket entpacken
        run: |
          python -m zipfile -e Geldabenteuer-GitHub.zip _site
          test -f _site/index.html
          test -f _site/Raiffi-Lernvideo-Schweizerstimme-v2.mp4
      - name: Lebensquest hinzufügen
        run: install -D lebensquest/index.html _site/lebensquest/index.html
      - name: Pages vorbereiten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Spiel hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - name: Spiel veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
