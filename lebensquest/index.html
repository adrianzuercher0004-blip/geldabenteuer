<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebensquest · Abfahrt Samstag</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#101525;--panel:#1e2943;--mint:#bdf584;--ink:#f6f5fa;--muted:#c3cae1}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,sans-serif}
main{max-width:830px;margin:auto;padding:18px}
h1,h2,p{margin:0 0 .55rem}h1{font-size:clamp(2rem,8vw,4rem);line-height:1;letter-spacing:-.05em}
.kicker{color:var(--mint);font-weight:800;letter-spacing:.14em;font-size:.75rem}
.status,.actions,.section-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.status{margin:14px 0}.status span{background:var(--panel);border-radius:9px;padding:6px 11px}
.board{position:relative;aspect-ratio:720/380;background:#334a58;border-radius:18px;overflow:hidden;isolation:isolate}
.board svg{display:block;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);box-shadow:0 3px 0 #0a1024;white-space:nowrap}
.pin[aria-pressed=true]{background:var(--mint);color:#14240d}
#station{left:22%;top:44%}#shop{left:50%;top:71%}#field{left:79%;top:35%}
button{min-height:44px;border:1px solid #68769a;border-radius:10px;background:#303e62;color:var(--ink);padding:8px 12px;font:inherit;font-weight:650;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mint)}button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.primary{background:var(--mint);color:#14240d;border-color:transparent}
.card{background:var(--panel);border-radius:15px;margin-top:12px;padding:14px}
.section-head{justify-content:space-between}.section-head h2{margin:0}
#info{border-radius:50%;min-width:44px}
#feedback{min-height:1.5em;color:var(--mint);margin-top:10px}
#plan{color:var(--muted);margin-bottom:10px}
dialog{background:var(--panel);color:var(--ink);border:1px solid #68769a;border-radius:16px;width:min(92%,440px);padding:20px}
dialog::backdrop{background:#06091bc9}
@keyframes appear{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.arrive{animation:appear .32s ease-out}
#arrival:not([hidden]){animation:appear .5s ease-out}
@media(prefers-reduced-motion:reduce){.arrive,#arrival:not([hidden]){animation:none}}
#arrival:not([hidden]){animation:appear .5s ease-out}
@media(max-width:460px){main{padding:12px}.pin{font-size:.8rem;padding:4px 7px}}
</style>
</head>
<body><main>
<p class="kicker">LEBENSQUEST · MISSION 01</p>
<h1>Abfahrt Samstag</h1>
<p>Schaff es ans Turnier. Bonus, wenn dir danach noch mindestens 30 CHF bleiben.</p>
<div class="status" aria-label="Spielstand"><span id="day"></span><span id="cash"></span></div>
<div class="board" aria-label="Stadtkarte">
<svg viewBox="0 0 720 380" aria-hidden="true">
 <defs><pattern id="grass" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2" fill="#779468" opacity=".42"/></pattern></defs>
 <path fill="#405e58" d="M0 0h720v380H0z"/><path fill="url(#grass)" d="M0 0h720v380H0z"/>
 <path d="M-25 290Q144 237 236 263T471 225Q584 182 745 245" fill="none" stroke="#232e47" stroke-width="58"/>
 <path d="M-25 290Q144 237 236 263T471 225Q584 182 745 245" fill="none" stroke="#a8a6a3" stroke-width="3" stroke-dasharray="12 14"/>
 <path d="M-20 89 260 89" stroke="#202939" stroke-width="38"/><path d="M-20 78H260M-20 100H260" stroke="#bac4c7" stroke-width="4"/>
 <rect x="56" y="61" width="174" height="54" rx="13" fill="#e0a359"/><rect x="79" y="73" width="97" height="19" rx="5" fill="#273b57"/><circle cx="204" cy="89" r="8" fill="#fff0bd"/>
 <path d="M275 286h160v62H275z" fill="#bc6765"/><path d="M259 288l26-31h141l26 31z" fill="#edb077"/><path d="M301 307h35v23h-35zM360 306h38v42h-38z" fill="#2c3f5c"/>
 <rect x="471" y="45" width="195" height="121" rx="13" fill="#7fa66a" stroke="#dbe3ba" stroke-width="3"/>
 <path d="M569 45v121M471 76h26v60h-26m195-60h-26v60h26" stroke="#dbe3ba" fill="none" stroke-width="3"/><circle cx="569" cy="106" r="22" fill="none" stroke="#dbe3ba" stroke-width="3"/>
 <g fill="#253f40"><circle cx="30" cy="210" r="17"/><circle cx="265" cy="151" r="22"/><circle cx="294" cy="174" r="16"/><circle cx="688" cy="178" r="23"/><circle cx="642" cy="326" r="25"/><circle cx="103" cy="333" r="25"/></g>
 <g id="arrival" hidden><circle cx="594" cy="86" r="19" fill="#bdf584"/><path d="m586 86 6 6 11-14" fill="none" stroke="#14240d" stroke-width="4" stroke-linecap="round"/></g>
</svg>
<button class="pin" id="station" aria-controls="location" aria-pressed="false">Bahnhof</button>
<button class="pin" id="shop" aria-controls="location" aria-pressed="false">Laden</button>
<button class="pin" id="field" aria-controls="location" aria-pressed="false">Sportplatz</button>
</div>
<section class="card" id="location" aria-labelledby="place">
<div class="section-head"><h2 id="place">Wohin zuerst?</h2><button id="info" aria-label="Erklärung zum gewählten Ort" hidden>?</button></div>
<p id="description">Tippe auf einen Ort und finde heraus, was du dort tun kannst.</p>
<div class="actions" id="actions"></div>
</section>
<section class="card" aria-labelledby="plan-title">
<h2 id="plan-title">Dein Plan</h2><p id="plan"></p>
<div class="actions"><button class="primary" id="next">Nächster Tag →</button><button id="hint">Tipp anzeigen</button><button id="reset" hidden>Nochmal spielen</button></div>
<p id="feedback" role="status"></p>
</section>
<dialog id="help" aria-labelledby="help-title"><h2 id="help-title"></h2><p id="help-text"></p><form method="dialog"><button class="primary">Zurück zur Karte</button></form></dialog>
</main>
<script>
const el=id=>document.getElementById(id);
const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const places={
 station:{name:'Bahnhof',help:'Bei einer Stornierung bekommst du den Kaufpreis abzüglich 10 CHF zurück. Der Zugpreis steigt ab Donnerstag. Das Ticket gilt für Hin- und Rückfahrt.'},
 shop:{name:'Laden',help:'Eine Schicht bringt 45 CHF, sobald du sie gearbeitet hast. Die Samstagsschicht fällt in die Turnierzeit. Mit einer Freitagsschicht kannst du verdienen und trotzdem fahren.'},
 field:{name:'Sportplatz',help:'Der letzte Platz im Teambus ist bis Mittwochabend verfügbar. Reservieren kostet 30 CHF für Hin- und Rückfahrt. Wenn du absagst, gibt es bis Freitag 25 CHF zurück.'}
};
let state;
function start(){
 state={day:0,cash:55,place:null,trip:null,shift:null,worked:false,finished:false,won:false};
 render('Finde eine Hin- und Rückfahrt für Samstag.');
}
const trainPrice=()=>state.day<3?65:80;
const busAvailable=()=>state.day<=2;
function book(mode,price){
 state.cash-=price;state.trip={mode,price};
 render(mode+' gebucht. Die Fahrt steht in deinem Plan.');
}
function cancelTrip(){
 const fee=state.trip.mode==='Zug'?10:5;
 state.cash+=state.trip.price-fee;
 state.trip=null;
 render('Fahrt storniert. Die Gebühr beträgt '+fee+' CHF.');
}
function addAction(label,action,disabled=false){
 const button=document.createElement('button');
 button.textContent=label;button.disabled=disabled;
 button.onclick=()=>{action();el('place').focus()};
 el('actions').append(button);
}
function renderPlace(){
 el('actions').replaceChildren();
 const place=places[state.place];
 el('info').hidden=!place;
 if(!place){
  el('place').textContent='Wohin zuerst?';
  el('description').textContent='Tippe auf einen Ort und finde heraus, was du dort tun kannst.';
  return;
 }
 el('place').textContent=place.name;
 if(state.place==='station'){
  const price=trainPrice();
  el('description').textContent='Zug hin und zurück · '+price+' CHF. '+(state.day<3?'Ab Donnerstag kostet das Ticket 80 CHF.':'Der Frühpreis ist abgelaufen.');
  if(!state.finished){
   if(state.trip?.mode==='Zug')addAction('Zugticket stornieren · 10 CHF Gebühr',cancelTrip);
   else addAction('Zugticket kaufen · '+price+' CHF',()=>book('Zug',price),Boolean(state.trip)||state.cash<price);
  }
 }
 if(state.place==='shop'){
  el('description').textContent='Eine Schicht bringt 45 CHF. Am Samstag arbeitest du zur gleichen Zeit, wie das Turnier stattfindet.';
  if(!state.finished&&!state.worked){
   for(const shift of [4,5]){
    if(shift<state.day)continue;
    if(state.shift===shift)addAction(days[shift]+' absagen',()=>{state.shift=null;render('Schicht abgesagt.')});
    else addAction(days[shift]+' eintragen · +45 CHF',()=>{state.shift=shift;render('Schicht für '+days[shift]+' eingetragen.')});
   }
  }
 }
 if(state.place==='field'){
  el('description').textContent=busAvailable()?'Ein Sitz im Teambus ist frei. Hin und zurück für 30 CHF. Reserviere bis Mittwochabend.':'Die Frist für neue Reservierungen ist abgelaufen.';
  if(!state.finished){
   if(state.trip?.mode==='Teambus'&&state.day<5)addAction('Busplatz abgeben · 5 CHF Gebühr',cancelTrip);
   else if(busAvailable())addAction('Busplatz reservieren · 30 CHF',()=>book('Teambus',30),Boolean(state.trip)||state.cash<30);
  }
 }
}
function render(message){
 el('day').textContent=days[state.day]+' · '+(state.day+1)+'/6';
 el('cash').textContent=state.cash+' CHF';
 el('plan').textContent=(state.trip?state.trip.mode+' gebucht':'Keine Fahrt gebucht')+' · '+(state.worked?'Schicht bezahlt':state.shift===null?'Keine Schicht':days[state.shift]+' · Schicht geplant');
 el('next').hidden=state.finished;
 el('next').textContent=state.day===5?'Samstag abschliessen →':'Nächster Tag →';
 el('hint').hidden=state.finished;
 el('reset').hidden=!state.finished;
 el('arrival').toggleAttribute('hidden',!state.won);
 for(const id of Object.keys(places))el(id).setAttribute('aria-pressed',String(state.place===id));
 renderPlace();
 if(message!==undefined){
  el('feedback').textContent=message;
  el('feedback').classList.remove('arrive');
  void el('feedback').offsetWidth;
  el('feedback').classList.add('arrive');
 }
}
function advance(){
 if(state.finished)return;
 let message='';
 if(state.shift===state.day&&!state.worked){
  state.cash+=45;state.worked=true;message='Schicht erledigt. +45 CHF. ';
 }
 if(state.day===5){
  state.finished=true;state.won=Boolean(state.trip)&&state.shift!==5;
  const result=state.won?'Du bist mit dem '+state.trip.mode+' am Turnier angekommen.':state.shift===5?'Deine Schicht fiel aufs Turnier.':'Ohne gebuchte Fahrt hast du das Turnier verpasst.';
  render(message+result+' Übrig: '+state.cash+' CHF.'+(state.won&&state.cash>=30?' Bonusziel erreicht!':''));
  el('reset').focus();
  return;
 }
 state.day++;
 if(state.day===3&&!state.trip)message+='Die Busfrist ist abgelaufen. Schau beim Bahnhof nach.';
 render(message||days[state.day]+' hat begonnen.');
}
function showHelp(title,body){
 el('help-title').textContent=title;el('help-text').textContent=body;el('help').showModal();
}
for(const id of Object.keys(places))el(id).onclick=()=>{state.place=id;render();el('place').focus()};
el('place').tabIndex=-1;
el('next').onclick=advance;
el('reset').onclick=()=>{start();el('station').focus()};
el('info').onclick=()=>showHelp(places[state.place].name+' · Kurz erklärt',places[state.place].help);
el('hint').onclick=()=>{
 const tip=state.shift===5?'Schau im Laden nach, ob du die Samstagsschicht absagen kannst.':state.trip?'Deine Fahrt steht. Schau im Laden, ob du dein Bonusziel noch erreichen kannst.':busAvailable()?'Frag beim Sportplatz nach dem freien Sitz im Teambus.':state.cash>=trainPrice()?'Am Bahnhof kannst du noch ein Ticket für Samstag kaufen.':state.day<=4?'Schau im Laden nach, ob du vor Samstag noch 45 CHF verdienen kannst.':'Überlege in der nächsten Runde, welche Frist du früher nutzen kannst.';
 showHelp('Ein Tipp',tip);
};
start();
</script>
</body></html>
